    # John Cayley (1730-95)
  </script>
  <script id="1" type="text/html">
    		
    <p>John Cayley, a successful merchant in Russia, was appointed British consul-general in St Petersburg in 1787. Here is some documentation relating to his appointment, and then his final year or so of ill-health.</p>



    <h3>Extract from the Minutes the Russia Company, 21st September&nbsp; 1787</h3>



    <p class="has-text-align-right">[National Archives, ref FO65/15 folio 268]</p>



    <p>That the Governor [of the Russia Company &#8211; the company of Russia merchants] be desired to wait on Lord Carmarthen [Foreign Secretary] to acquaint him that from the known good Character of John Cayley Esqr and from his long experience in business which he will engage to quit it is the wish of the Russia Company humbly to recommend him to his Majesty as a proper person to be appointed his Majesty&#8217;s Consul General at St. Petersburg.</p>



    <h3>Letter of 22 October 1787 from John Cayley at St Petersburg to Lord Carmarthen (Foreign Secretary)</h3>



    <p class="has-text-align-right">[National Archives, ref. ref FO65/15  XC017200]</p>



    <p>My Lord!</p>



    <p>I received last night the Honour of your Lordship&#8217;s letters of the 2d Instant, No 1 &amp; 2.</p>



    <p>Permit me to return your Lordship my most hearty thanks for the very obliging manner in which you have informed me that in consequence of the Russia Company&#8217;s Recommendation in my favour, His Majesty has been graciously pleased to appoint me to be his Consul General in all the Dominions of the Empress of Russia; and that my Commission signed was ready to be delivered out to such Person as I might appoint to receive it.</p>



    <p>I have not words my Lord to express the Sentiments of a most grateful Heart for such a distinguished mark of Honour. May I presume my Lord to request that your Lordship will assure his Majesty of the profound Respect I have for his most sacred Person, &amp; that it shall be the constant Study of my Life to execute zealously the Duties of that most important Situation.</p>



    <p>Under your Lordship&#8217;s Auspices I flatter myself that my Endeavours will be crowned with Success, and that I may not be found unworthy of your Lordship&#8217;s Protection.</p>



    <p>In Obedience to his Majesty&#8217;s Command I will not fail to communicate to your Lordship as son as possible, the best Accounts I can collect of the State and Success of the Greenland &amp; Southern Whale Fisheries carried on from any part of this Country in the last and present Year, together with a particular Account of any Loss or Damage which may have been sustained by the Ships from the Ice in the Course of this last season.</p>



    <p>I apprehend the only Ships employed are in the Greenland &amp; Northern Fisheries, and will have been sent out from the Ports of Kola and Archangel.</p>



    <p>Mr Godfrey Thornton will do himself the Honour of calling at your Lordship&#8217;s Office for my Commission.</p>



    <p>I have the Honour to be with the greatest Respect</p>



    <p class="has-text-align-left">My Lord<br>Your Lordship&#8217;s<br>Most Obedient &amp; most<br>humble Servant<br>Jn Cayley</p>



    <h3>Letter of 8 March 1794 from John Cayley at St Petersburg to Lord Grenville requesting leave of absence on health grounds</h3>



    <p class="has-text-align-right">[National Archives, ref. ref FO65/26   XC23140]</p>



    <p>My Lord!</p>



    <p>I had the honour of receiving your Lordship&#8217;s letter of the 21st Jany with an inclosed Copy of His Majesty&#8217;s most gracious speech at the opening of the last session of Parliament. The Post following brought me from the office the Address of both Houses on the occasion. It gave me infinite pleasure to observe so great a majority approving of the measures of His Majesty&#8217;s Ministers, and it is to be expected, their perseverance so strongly supported will be attended with the greatest Success.</p>



    <p>Inclosed I take the liberty of sending to your Lordship the State of the Years Trade from hence &amp; likewise from the Outposts. The Reports from the frontier Custom Houses &amp; from the Ports on the Black Sea are not yet all collected, but shall follow as soon as possible.</p>



    <p>The great dimenution of the Imports of last Year has hitherto had no other Effect than a considerable reduction of the Revenues arising from the Duties. The Course of Exchange continues in its depressed State and from the great Circulation of Paper &amp; the Scarcity of Currency is likely to continue, tho it may in the Course of the Summer advance a little and that seems to be one motive for their adhering so strenuously to their late prohibitions and which all the Exertions of Sr Charles Whitworth have not yet been able to remove.</p>



    <p>For some time past my Lord my Health has been so much impaired &amp; all the remedies made use of having proved ineffectual a Change of Air for a short time has been very strongly recommended. Some Family Concerns likewise requiring my presence in England. May I be so bold as to request your Lordship to ask His Majesty&#8217;s most gracious permission for a twelvemonths Absence: during that period, if not objected to my Eldest Son Mr John Cayley Junr will transmit to your Lordship any information that may be necessary &amp; would be happy to have the honour of executing any Commands that your Lordship might have occasion to give me during the Interval.</p>



    <p>I flatter myself the Occasion will be considered as a sufficient apology for soliciting the favour &amp; that it will afford me an opportunity of paying your Lordship my personal Respects &amp; of assuring you of how sensible I am of the honour of the Protection your Lordship has hitherto favoured me with.</p>



    <p>I have the honour to be<br>My Lord<br>Your Lordship&#8217;s<br>Most Obedient and<br>most humble Servt<br>Jn. Cayley</p>



    <h3>Letter of 23 June 1795 from John Cayley at London to Lord Grenville, requesting an extension of his leave of absence</h3>



    <p class="has-text-align-right">[National Archives, ref FO65/30  XC21073]</p>



    <p>My Lord</p>



    <p>The time drawing to an End for which I had His Majesty&#8217;s Leave of Absence from my Post at Petersburg I find myself under the necessity of representing to your Lordship that from the severity of last Winter &amp; the unsettled Weather almost ever since, my Health has been so little benefited by the change of air, that in the opinion of the Faculty[?] a return to Russia this season might prove very prejudicial &amp; I am strongly recommended to try the Country Air, Exercise and a quiet Life for some time. May I my Lord on that account request your Lordship&#8217;s kind solicitations for His Majesty&#8217;s further most gracious permission for another Years absence. My son will continue to act for me as he has done lately[?], I hope with your Lordship&#8217;s approbation.</p>



    <p>I flatter myself that this further Indulgence will not be considered as presumptuous, having no other Object in view than the reestablishment of my Health that I may be the better able to execute the Duties of my Office.</p>



    <p>I have the honour to be most respectfully<br>My Lord<br>Your Lordship&#8217;s<br>most Obedient and<br>most humble Servt<br>Jn Cayley</p>
